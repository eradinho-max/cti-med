name: CTI Smoke Tests

on:
  push:
    branches:
      - main
      - 'recovery/**'
      - 'feature/**'
      - 'fix/**'
  pull_request:
    branches:
      - main

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CTI_REQUIRE_AUTH: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: pip install -r requirements.txt
      - name: Python syntax
        run: python -m py_compile main.py kotu_api.py clinical_ai.py ia_provedores.py security_auth.py user_store.py sync_store.py segunda_fase.py atualizacoes.py
      - name: JavaScript syntax
        run: |
          node --check static/app.js
          node --check static/cti-app-v31.js
          node --check static/mb32.js
          node --check static/mb33.js
          node --check static/kotu.js
          node --check static/sync.js
          node --check static/sw.js
      - name: Auth and sync decoupling
        run: |
          python - <<'PY'
          import os
          os.environ["CTI_ACCESS_USERNAME"]="admin"
          os.environ["CTI_ACCESS_PASSWORD"]="Password-123!"
          os.environ["CTI_DATABASE_URL"]="postgresql://should-not-control-auth"
          os.environ.pop("CTI_AUTH_BACKEND",None)
          from user_store import AutoUserStore
          s=AutoUserStore()
          assert s.mode=="environment-single-admin", s.mode
          assert s.authenticate("admin","Password-123!")
          from sync_store import SyncStore
          sync=SyncStore()
          assert sync.configured is True
          print("auth/sync decoupling OK")
          PY
      - name: Explicit account migration logic
        run: |
          python - <<'PY'
          import os
          from datetime import datetime, timezone
          os.environ["CTI_ACCESS_USERNAME"]="test-admin"
          os.environ["CTI_ACCESS_PASSWORD"]="Old-Test-Passphrase-123!"
          from argon2 import PasswordHasher
          from user_store import PostgresUserStore

          class FakeStore(PostgresUserStore):
              def __init__(self):
                  self.url="postgresql://fake"
                  from user_store import EnvUserStore
                  self.env_fallback=EnvUserStore()
                  self.hasher=PasswordHasher()
                  self._dummy_hash=self.hasher.hash("dummy")
                  now=datetime.now(timezone.utc)
                  self.row={
                      "id":"u1","username":"test-admin","username_norm":"test-admin",
                      "password_hash":self.hasher.hash("unusable-random-secret"),
                      "role":"admin","active":True,"session_version":1,
                      "created_at":now,"updated_at":now,"last_login_at":None,
                      "password_changed_at":now,"deleted_at":None,
                  }
              @property
              def ready(self): return True
              def _get_user_by_norm(self, username_norm, include_deleted=False):
                  return self.row if username_norm=="test-admin" else None
              def _get_user_by_id(self, user_id, include_deleted=False):
                  return self.row if user_id=="u1" else None
              def count_users(self): return 1

          s=FakeStore()
          assert s.migration_pending is True
          u=s.authenticate("test-admin","Old-Test-Passphrase-123!")
          assert u and u.source=="migration-env" and u.user_id=="u1"
          assert s.authenticate("test-admin","wrong-password") is None
          s.row["last_login_at"]=datetime.now(timezone.utc)
          assert s.migration_pending is False
          assert s.authenticate("test-admin","Old-Test-Passphrase-123!") is None
          print("explicit migration fallback OK")
          PY
      - name: Sync safety guards
        run: |
          python - <<'PY'
          from pathlib import Path
          js=Path("static/sync.js").read_text()
          assert "location.reload()" not in js
          assert "setInterval(" not in js
          assert "addEventListener('focus'" not in js
          assert "visibilitychange" not in js
          assert "MAX_REQUEST_BYTES" in js and "MAX_KEY_CHARS" in js
          assert "changedLocal&&changedRemote&&!same" in js
          assert "cti_sync_meta_safe_v2" in js
          backend=Path("sync_store.py").read_text()
          assert "conn.autocommit=False" in backend
          assert "FOR UPDATE" in backend
          print("sync safety guards OK")
          PY
      - name: PWA integrity
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          manifest=json.loads(Path("static/manifest.json").read_text())
          assert manifest["start_url"]=="/"
          assert manifest["scope"]=="/"
          assert manifest["display"]=="standalone"
          assert manifest.get("orientation")=="any"
          assert manifest.get("id")=="/"
          icons=manifest.get("icons",[])
          sizes={i.get("sizes") for i in icons}
          assert "192x192" in sizes and "512x512" in sizes
          html=Path("static/index.html").read_text()
          assert 'rel="manifest"' in html
          assert 'viewport-fit=cover' in html
          assert 'apple-mobile-web-app-capable' in html
          sw=Path("static/sw.js").read_text()
          assert "serviceWorker" not in sw or "fetch" in sw
          assert "/static/offline.html" in sw
          PY
      - name: API smoke tests
        run: |
          python - <<'PY'
          from fastapi.testclient import TestClient
          import main

          c = TestClient(main.app)
          assert c.get("/").status_code == 200

          stats = c.get("/api/stats")
          assert stats.status_code == 200, stats.text
          assert stats.json()["total_questoes"] > 1000

          indice = c.get("/api/indice")
          assert indice.status_code == 200, indice.text
          rows = indice.json()
          assert len(rows) > 1000
          qid = rows[0]["id"]

          lote = c.post("/api/questoes/lote", json={"ids":[qid]})
          assert lote.status_code == 200, lote.text
          q = lote.json()["items"][0]
          sel = next(letter for letter in "ABCDEFGH" if q.get("alt_"+letter))

          resp = c.post("/api/responder", json={"question_id":qid, "selected_option":sel})
          assert resp.status_code == 200, resp.text
          assert resp.json().get("gabarito_oficial")

          sim = c.post("/api/simulado", json={"n":10, "ordem":"aleatoria", "seed":"ci"})
          assert sim.status_code == 200, sim.text
          assert len(sim.json()["items"]) == 10

          mis = c.post("/api/missao", json={"n":15, "modo":"equilibrada", "semente_usuario":"ci"})
          assert mis.status_code == 200, mis.text
          assert len(mis.json()["items"]) == 15

          est = c.get("/api/estacoes")
          assert est.status_code == 200, est.text
          assert len(est.json()) > 0

          ref = c.get("/api/reforco")
          assert ref.status_code == 200, ref.text
          assert "temas" in ref.json()

          # Kotu deve falhar de forma controlada sem chave, nunca derrubar o app.
          k = c.post("/api/kotu/chat", json={"message":"Olá","history":[],"context":{"origin":"home"}})
          assert k.status_code == 200, k.text
          assert isinstance(k.json().get("ok"), bool)

          material = c.post("/api/kotu/estudo", json={"context":{"origin":"question","questionId":qid,"answered":True,"selectedOption":sel,"mode":"treino"}})
          assert material.status_code == 200, material.text
          assert isinstance(material.json().get("ok"), bool)

          # Radar de atualizações precisa existir independentemente de chave de IA.
          ar = c.get("/api/atualizacoes/areas")
          assert ar.status_code == 200, ar.text
          assert "areas" in ar.json()
          PY
