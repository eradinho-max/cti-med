name: CTI Smoke Tests

on:
  push:
    branches:
      - main
      - 'recovery/**'
      - 'feature/**'
      - 'fix/**'
  pull_request:
    branches:
      - main

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CTI_REQUIRE_AUTH: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: pip install -r requirements.txt
      - name: Python syntax
        run: python -m py_compile main.py kotu_api.py clinical_ai.py ia_provedores.py security_auth.py user_store.py sync_store.py segunda_fase.py atualizacoes.py
      - name: JavaScript syntax
        run: |
          node --check static/app.js
          node --check static/cti-app-v31.js
          node --check static/mb32.js
          node --check static/mb33.js
          node --check static/cera.js
          node tools/test_cera_suggestions.cjs
          node tools/test_cera_standalone.cjs
          node --check static/kotu.js
          node --check static/sync.js
          node --check static/sw.js
          node --check static/pwa.js
      - name: Auth and sync decoupling
        run: |
          python - <<'PY'
          import os
          os.environ["CTI_ACCESS_USERNAME"]="admin"
          os.environ["CTI_ACCESS_PASSWORD"]="Password-123!"
          os.environ["CTI_DATABASE_URL"]="postgresql://should-not-control-auth"
          os.environ.pop("CTI_AUTH_BACKEND",None)
          from user_store import AutoUserStore
          s=AutoUserStore()
          assert s.mode=="environment-single-admin", s.mode
          assert s.authenticate("admin","Password-123!")
          from sync_store import SyncStore
          sync=SyncStore()
          assert sync.configured is False
          os.environ["CTI_SYNC_DATABASE_URL"]="postgresql://sync-only"
          assert SyncStore().configured is True
          print("auth/sync decoupling OK")
          PY
      - name: Explicit account migration logic
        run: |
          python - <<'PY'
          import os
          from datetime import datetime, timezone
          os.environ["CTI_ACCESS_USERNAME"]="test-admin"
          os.environ["CTI_ACCESS_PASSWORD"]="Old-Test-Passphrase-123!"
          from argon2 import PasswordHasher
          from user_store import PostgresUserStore

          class FakeStore(PostgresUserStore):
              def __init__(self):
                  self.url="postgresql://fake"
                  from user_store import EnvUserStore
                  self.env_fallback=EnvUserStore()
                  self.hasher=PasswordHasher()
                  self._dummy_hash=self.hasher.hash("dummy")
                  now=datetime.now(timezone.utc)
                  self.row={
                      "id":"u1","username":"test-admin","username_norm":"test-admin",
                      "password_hash":self.hasher.hash("unusable-random-secret"),
                      "role":"admin","active":True,"session_version":1,
                      "created_at":now,"updated_at":now,"last_login_at":None,
                      "password_changed_at":now,"deleted_at":None,
                  }
              @property
              def ready(self): return True
              def _get_user_by_norm(self, username_norm, include_deleted=False):
                  return self.row if username_norm=="test-admin" else None
              def _get_user_by_id(self, user_id, include_deleted=False):
                  return self.row if user_id=="u1" else None
              def count_users(self): return 1

          s=FakeStore()
          assert s.migration_pending is True
          u=s.authenticate("test-admin","Old-Test-Passphrase-123!")
          assert u and u.source=="migration-env" and u.user_id=="u1"
          assert s.authenticate("test-admin","wrong-password") is None
          s.row["last_login_at"]=datetime.now(timezone.utc)
          assert s.migration_pending is False
          assert s.authenticate("test-admin","Old-Test-Passphrase-123!") is None
          print("explicit migration fallback OK")
          PY
      - name: Authenticated admin regression with sync disabled
        env:
          CTI_REQUIRE_AUTH: "1"
          CTI_ACCESS_USERNAME: "test-admin"
          CTI_ACCESS_PASSWORD: "Not-A-Real-Credential-123"
          CTI_SESSION_SECRET: "Not-A-Real-Session-Secret-456"
          CTI_DATABASE_URL: "postgresql://unreachable-sync-only"
          CTI_SYNC_ENABLED: "0"
        run: |
          python - <<'PY'
          from fastapi.testclient import TestClient
          import main
          c=TestClient(main.app)
          public=c.get("/")
          assert public.status_code in (200,401), public.text
          unauth=c.get("/api/auth/status")
          assert unauth.status_code==200 and unauth.json()["configured"] is True
          assert unauth.json()["sync_available"] is False
          login=c.post("/api/auth/login",json={"username":"test-admin","password":"Not-A-Real-Credential-123"})
          assert login.status_code==200, login.text
          status=c.get("/api/auth/status")
          assert status.status_code==200 and status.json()["authenticated"] is True, status.text
          assert status.json()["sync_available"] is False
          sec=c.get("/api/admin/security-status")
          assert sec.status_code==200, sec.text
          assert sec.json()["current_store"]=="environment-single-admin", sec.text
          assert sec.json()["sync_enabled"] is False
          assert c.get("/api/stats").status_code==200
          sync=c.get("/api/sync/state?namespace=progress")
          assert sync.status_code==503, sync.text
          assert c.get("/api/admin/users/status").status_code==200
          print("PASS authenticated session/admin while sync database is unavailable")
          PY
      - name: Secure cookie logout navigation regression
        env:
          CTI_ENV: "production"
          CTI_REQUIRE_AUTH: "1"
          CTI_AUTH_BACKEND: "env"
          CTI_ACCESS_USERNAME: "test-admin"
          CTI_ACCESS_PASSWORD: "Not-A-Real-Credential-123"
          CTI_SESSION_SECRET: "Not-A-Real-Session-Secret-456"
          CTI_SYNC_ENABLED: "0"
        run: |
          python - <<'PY'
          from fastapi.testclient import TestClient
          import main
          c=TestClient(main.app,base_url="https://testserver")
          credentials={"username":"test-admin","password":"Not-A-Real-Credential-123"}
          assert c.post("/api/auth/login",json=credentials).status_code==200
          assert c.get("/api/auth/status").json()["authenticated"] is True
          csrf=c.cookies.get("cti_csrf")
          assert csrf
          assert c.post("/api/auth/logout-page",data={"csrf":"invalid"},follow_redirects=False).status_code==403
          assert c.get("/api/auth/status").json()["authenticated"] is True
          r=c.post("/api/auth/logout-page",data={"csrf":csrf},follow_redirects=False)
          assert r.status_code==303, r.text
          assert r.headers["location"]=="/?reason=logout"
          cookies=r.headers.get_list("set-cookie")
          assert any("__Host-cti_session=" in x and "Max-Age=0" in x and "Secure" in x and "HttpOnly" in x for x in cookies), cookies
          assert c.get("/api/auth/status").json()["authenticated"] is False
          assert c.get("/api/stats").status_code==401
          assert c.get(r.headers["location"]).status_code==200
          assert c.post("/api/auth/login",json=credentials).status_code==200
          assert c.get("/api/auth/status").json()["authenticated"] is True
          print("PASS: secure logout, invalid CSRF rejected, protected data inaccessible, re-login")
          PY
      - name: Dedicated sync database guard
        run: |
          python - <<'PY'
          import os
          from sync_store import SyncStore
          os.environ.pop("CTI_SYNC_DATABASE_URL", None)
          os.environ["CTI_DATABASE_URL"] = "postgresql://must-not-be-used-for-sync"
          assert SyncStore().configured is False
          os.environ["CTI_SYNC_DATABASE_URL"] = "postgresql://sync-only"
          assert SyncStore().configured is True
          print("PASS: sync database requires dedicated variable")
          PY
      - name: Two-device sync regression (Node VM)
        run: node tests/sync-regression.cjs
      - name: Sync safety guards
        run: |
          python - <<'PY'
          from pathlib import Path
          js=Path("static/sync.js").read_text()
          assert "location.reload()" not in js
          assert "setInterval(" not in js
          assert "addEventListener('pageshow'" in js and "visibilitychange" in js
          assert "AUTO_MIN=5000" in js and "AUTO_RETRY=120000" in js
          assert "notifyChange" in js and "autoDue<=due" in js
          assert "sync_auto_available===true" in js and "autoPaused" in js
          assert "MAX_REQUEST_BYTES" in js and "MAX_KEY_CHARS" in js
          assert "changedLocal&&changedRemote&&!same" in js
          assert "cti_sync_meta_safe_v2" in js
          backend=Path("sync_store.py").read_text()
          assert "conn.autocommit=False" in backend
          assert "FOR UPDATE" in backend
          print("sync safety guards OK")
          PY
      - name: PWA integrity
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          manifest=json.loads(Path("static/manifest.json").read_text())
          assert manifest["start_url"]=="/"
          assert manifest["scope"]=="/"
          assert manifest["display"]=="standalone"
          assert manifest.get("orientation")=="any"
          assert manifest.get("id")=="/"
          icons=manifest.get("icons",[])
          sizes={i.get("sizes") for i in icons}
          assert "192x192" in sizes and "512x512" in sizes
          html=Path("static/index.html").read_text()
          assert 'rel="manifest"' in html
          assert 'viewport-fit=cover' in html
          assert 'apple-mobile-web-app-capable' in html
          login=Path("static/login.html").read_text()
          for page in (html,login):
              assert 'rel="manifest" href="/static/manifest.json"' in page
              assert 'apple-touch-icon' in page and '/static/pwa.js' in page
              assert 'data-pwa-install' in page
          from struct import unpack
          for icon in icons:
              if icon["type"]=="image/png":
                  asset=Path(icon["src"].lstrip("/")).read_bytes()
                  assert asset[:8]==b"\x89PNG\r\n\x1a\n"
                  w,h=unpack(">II",asset[16:24])
                  assert f"{w}x{h}"==icon["sizes"]
          pwa=Path("static/pwa.js").read_text()
          assert "beforeinstallprompt" in pwa and "register('/sw.js'" in pwa
          from fastapi.testclient import TestClient
          import main
          client=TestClient(main.app)
          response=client.get("/static/manifest.json")
          assert response.status_code==200 and "application/manifest+json" in response.headers["content-type"]
          response=client.get("/sw.js")
          assert response.status_code==200 and response.headers["service-worker-allowed"]=="/"
          for icon in icons:
              assert client.get(icon["src"]).status_code==200
          sw=Path("static/sw.js").read_text()
          assert "serviceWorker" not in sw or "fetch" in sw
          assert "/static/offline.html" in sw and "Promise.allSettled" in sw
          assert "cache.addAll" not in sw
          assert "/static/cera.js" in Path("static/app.js").read_text()
          assert "/static/cera.css" in Path("static/app.css").read_text()
          assert "cti_cera_v1" in Path("static/sync.js").read_text()
          PY
      - name: API smoke tests
        run: |
          python - <<'PY'
          from fastapi.testclient import TestClient
          import main

          c = TestClient(main.app)
          assert c.get("/").status_code == 200

          stats = c.get("/api/stats")
          assert stats.status_code == 200, stats.text
          assert stats.json()["total_questoes"] > 1000

          indice = c.get("/api/indice")
          assert indice.status_code == 200, indice.text
          rows = indice.json()
          assert len(rows) > 1000
          qid = rows[0]["id"]

          lote = c.post("/api/questoes/lote", json={"ids":[qid]})
          assert lote.status_code == 200, lote.text
          q = lote.json()["items"][0]
          sel = next(letter for letter in "ABCDEFGH" if q.get("alt_"+letter))

          resp = c.post("/api/responder", json={"question_id":qid, "selected_option":sel})
          assert resp.status_code == 200, resp.text
          assert resp.json().get("gabarito_oficial")

          sim = c.post("/api/simulado", json={"n":10, "ordem":"aleatoria", "seed":"ci"})
          assert sim.status_code == 200, sim.text
          assert len(sim.json()["items"]) == 10

          mis = c.post("/api/missao", json={"n":15, "modo":"equilibrada", "semente_usuario":"ci"})
          assert mis.status_code == 200, mis.text
          assert len(mis.json()["items"]) == 15

          est = c.get("/api/estacoes")
          assert est.status_code == 200, est.text
          assert len(est.json()) > 0

          ref = c.get("/api/reforco")
          assert ref.status_code == 200, ref.text
          assert "temas" in ref.json()

          # Kotu deve falhar de forma controlada sem chave, nunca derrubar o app.
          k = c.post("/api/kotu/chat", json={"message":"Olá","history":[],"context":{"origin":"home"}})
          assert k.status_code == 200, k.text
          assert isinstance(k.json().get("ok"), bool)

          material = c.post("/api/kotu/estudo", json={"context":{"origin":"question","questionId":qid,"answered":True,"selectedOption":sel,"mode":"treino"}})
          assert material.status_code == 200, material.text
          assert isinstance(material.json().get("ok"), bool)

          # Radar de atualizações precisa existir independentemente de chave de IA.
          ar = c.get("/api/atualizacoes/areas")
          assert ar.status_code == 200, ar.text
          assert "areas" in ar.json()
          PY
